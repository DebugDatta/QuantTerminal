[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111C30"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
